name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Derive release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const v=process.env.VERSION; if(!/^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$/.test(v)){ throw new Error('Invalid semver from tag: '+v); }"

      - name: Resolve published thrust-wasm version
        run: |
          THRUST_WASM_VERSION="$(npm view thrust-wasm version)"
          echo "THRUST_WASM_VERSION=$THRUST_WASM_VERSION" >> "$GITHUB_ENV"

      - name: Prepare package version and dependencies for publish
        run: |
          npm version --no-git-tag-version "$VERSION"
          npm pkg set "dependencies.thrust-wasm=^${THRUST_WASM_VERSION}"
          npm install

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish package
        run: npm publish --access public --provenance

      - name: Sync package version back to master
        run: |
          git fetch origin master
          git switch master
          npm version --no-git-tag-version "$VERSION"
          npm pkg set "dependencies.thrust-wasm=^${THRUST_WASM_VERSION}"
          npm install --package-lock-only
          if git diff --quiet package.json package-lock.json; then
            echo "No version changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump package version to v${VERSION}"
          git push origin master
